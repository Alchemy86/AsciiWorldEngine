# AsciiWorldEngine.
#
# A workspace. `engine/` is the engine: the cell grid, glyph ramps, colour,
# ANSI/SVG output, raw terminal input, frame capture and the frame clock —
# everything a coloured-ASCII program shares and nothing about what it draws.
# This root package is the city, the first program built on it, and it stays
# the default: `cargo run` and you are walking the city. No node, no browser,
# no wasm anywhere on that path.
#
# The city's wasm/browser build is an optional extra target off the same core
# (`--no-default-features --features wasm`), not the foundation.

[workspace]
members = [".", "engine"]
default-members = [".", "engine"]
resolver = "2"

[package]
name = "asciicity"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An ASCII 3D city — world, movement, projection and renderer, all in Rust"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Aaron Gibson"]
publish = false

[lib]
name = "asciicity"
path = "src/lib.rs"
# cdylib for the wasm target, rlib so the bins link it, staticlib so the core
# can be embedded from C the way the sibling project allows.
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "asciicity"
path = "src/bin/asciicity.rs"
required-features = ["tui"]

[features]
# The default build is the thing you play: a native terminal binary.
default = ["tui"]
# Terminal frontend: raw mode, the kitty keyboard protocol for real key-hold
# movement, 24-bit ANSI paint. The ONLY thing that pulls in an outside crate,
# and it pulls in exactly one (libc, for termios + TIOCGWINSZ), through the
# engine's `term` feature.
tui = ["ascii-engine/term"]
# The browser build. Adds `extern "C"` exports over the same flat frame buffer.
# Off by default; see build-wasm.sh.
wasm = []

[dependencies]
# Core is dependency-free on purpose: `--no-default-features` builds the whole
# city — world, camera, projection, renderer — and the engine under it with
# nothing but the standard library.
ascii-engine = { path = "engine" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
